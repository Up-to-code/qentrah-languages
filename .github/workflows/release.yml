name: Publish approved plugin artifacts
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Verify approved artifacts
        run: |
          test "v$(cat .approved-release/version)" = "$GITHUB_REF_NAME"
          cd .approved-release
          sha256sum -c SHA256SUMS
      - name: Attach exact approved ZIPs
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" .approved-release/*.zip .approved-release/SHA256SUMS --title "Qentrah Languages $GITHUB_REF_NAME" --notes "Approved source and packages published from Qentrah's product release workflow."
